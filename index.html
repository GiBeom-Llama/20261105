<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="경북전문대학교 소방안전공학과 위험물기능사 필기 대비 퀴즈">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>위험물 Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like a phone screen; a red hazard plate heads the page, one question at a time below it. */
:root {
  --paper: #F4F6F9;
  --card: #FFFFFF;
  --ink: #14213D;
  --muted: #5A6378;
  --line: #D9DEE7;
  --signal: #C8102E;
  --on-signal: #FFFFFF;
  --good: #17784A;
  --good-bg: #E5F3EB;
  --bad: #B42318;
  --bad-bg: #FCEBE9;
  --focus: #2F6FEB;
  /* 류별 색: 1 산화성 고체 · 2 가연성 고체 · 3 자연발화·금수 · 4 인화성 액체 · 5 자기반응성 · 6 산화성 액체 */
  --c1: #E8590C; --c2: #946200; --c3: #1C6DD0; --c4: #C8102E; --c5: #7B3FB6; --c6: #A07800;
  --dot: rgba(20, 33, 61, 0.07);
  --shadow: 0 1px 2px rgba(20, 33, 61, 0.06), 0 10px 28px -12px rgba(20, 33, 61, 0.18);
  --tape-a: #FFC21A; --tape-b: #14213D;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1420; --card: #162033; --ink: #E7EBF3; --muted: #9AA3B7; --line: #2A3550;
    --signal: #E63A50; --on-signal: #FFFFFF; --good: #4CC38A; --good-bg: #12301F;
    --bad: #FF7B6E; --bad-bg: #3A1A1A; --focus: #7AA5FF; color-scheme: dark;
    --c1: #FF8A3D; --c2: #D9A35A; --c3: #5B9BFF; --c4: #FF5468; --c5: #B48CF2; --c6: #E6C04A;
    --dot: rgba(231, 235, 243, 0.05);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px -12px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  --paper: #0E1420; --card: #162033; --ink: #E7EBF3; --muted: #9AA3B7; --line: #2A3550;
  --signal: #E63A50; --on-signal: #FFFFFF; --good: #4CC38A; --good-bg: #12301F;
  --bad: #FF7B6E; --bad-bg: #3A1A1A; --focus: #7AA5FF; color-scheme: dark;
  --c1: #FF8A3D; --c2: #D9A35A; --c3: #5B9BFF; --c4: #FF5468; --c5: #B48CF2; --c6: #E6C04A;
  --dot: rgba(231, 235, 243, 0.05);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px -12px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }

/* Header plate */
.plate {
  background: var(--signal);
  color: var(--on-signal);
  border-radius: 6px;
  padding: 18px 20px 16px;
  display: grid;
  gap: 2px;
}
.plate .eyebrow { font-size: 13px; letter-spacing: 0.04em; opacity: 0.9; }
.plate h1 { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.15; margin: 0; letter-spacing: 0.01em; }
.plate .sub { font-size: 14px; opacity: 0.92; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: grid; gap: 16px; }
h2 { font-size: 18px; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }

/* Buttons */
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn {
  min-height: 52px; border-radius: 6px; padding: 12px 18px; font-weight: 700; font-size: 16px;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
}
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .btn-row { grid-template-columns: 1fr; } }

/* Start screen */
.modes { display: grid; gap: 10px; }
.mode {
  text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 6px;
  padding: 14px 16px; display: grid; gap: 2px;
}
.mode strong { font-size: 17px; }
.mode span { color: var(--muted); font-size: 14px; }
.mode:hover { border-color: var(--ink); }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; }
.field input {
  font: inherit; min-height: 48px; padding: 10px 12px; border-radius: 6px;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.classes { display: flex; flex-wrap: wrap; gap: 6px; }
.classes span { font-size: 13px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; color: var(--muted); }
.classes b { color: var(--ink); font-weight: 700; }

/* Question screen */
.progress-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.count { font-family: var(--font-num); font-size: 15px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--signal); transition: width .25s ease; }
.chip { font-size: 13px; font-weight: 700; border: 1.5px solid var(--ink); border-radius: 4px; padding: 1px 8px; white-space: nowrap; }
.question { font-size: 19px; font-weight: 700; line-height: 1.5; text-wrap: pretty; }
.choices { display: grid; gap: 10px; }
.choice {
  display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 8px; text-align: left;
  min-height: 56px; padding: 10px 14px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--card);
}
.choice:hover:not(:disabled) { border-color: var(--ink); }
.choice .num { font-family: var(--font-num); font-size: 15px; color: var(--muted); }
.choice:disabled { cursor: default; }
.choice.correct { border-color: var(--good); background: var(--good-bg); }
.choice.correct .num { color: var(--good); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice.wrong .num { color: var(--bad); }
.feedback { border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; border: 1.5px solid; }
.feedback.ok { border-color: var(--good); background: var(--good-bg); }
.feedback.no { border-color: var(--bad); background: var(--bad-bg); }
.feedback .verdict { font-weight: 700; }
.feedback.ok .verdict { color: var(--good); }
.feedback.no .verdict { color: var(--bad); }

/* Result */
.cert { border: 2px solid var(--ink); border-radius: 6px; padding: 20px; display: grid; gap: 10px; background: var(--card); }
.cert-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.score { display: flex; align-items: baseline; gap: 6px; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 64px; line-height: 1; }
.score span { font-size: 20px; font-weight: 700; }
.verdict-pill { justify-self: start; font-weight: 700; font-size: 15px; padding: 4px 12px; border-radius: 999px; }
.verdict-pill.pass { background: var(--good-bg); color: var(--good); }
.verdict-pill.fail { background: var(--bad-bg); color: var(--bad); }
.cert .name { font-size: 18px; font-weight: 700; }
.review { display: grid; gap: 12px; }
.review-item { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
.review-item .q { font-weight: 700; }
.review-item .a { color: var(--good); font-weight: 500; }
.review-item .mine { color: var(--bad); font-size: 14px; }
.foot { text-align: center; color: var(--muted); font-size: 13px; }

/* Mode groups */
.group { display: grid; gap: 8px; }
.group-label { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip.quiet { border-color: var(--line); color: var(--muted); font-weight: 500; }

/* O/X */
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ox-btn {
  min-height: 112px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--card);
  font-family: var(--font-display); font-size: 56px; line-height: 1; display: grid; place-items: center;
}
.ox-btn:hover:not(:disabled) { border-color: var(--ink); }
.ox-btn:disabled { cursor: default; }
.ox-btn.correct { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.ox-btn.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }

/* Short answer */
.sa { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.sa input {
  font: inherit; font-size: 18px; min-height: 52px; padding: 10px 14px; border-radius: 6px; min-width: 0;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.sa input.correct { border-color: var(--good); background: var(--good-bg); }
.sa input.wrong { border-color: var(--bad); background: var(--bad-bg); }
.sa .btn { min-width: 84px; }
.sa.done { grid-template-columns: 1fr; }

/* Student ID + name */
.who { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.who .field { min-width: 0; }
.who input { width: 100%; }
@media (max-width: 380px) { .who { grid-template-columns: 1fr; } }
.field input.missing { border-color: var(--bad); }
.form-error { color: var(--bad); font-size: 14px; font-weight: 500; }
.cert .sid, .detail .sid { font-family: var(--font-num); font-weight: 500; font-variant-numeric: tabular-nums; margin-right: 6px; }

/* Submission */
.foot { display: grid; gap: 6px; justify-items: center; }
.admin-link { color: var(--ink); font-weight: 700; font-size: 14px; text-underline-offset: 3px; }
.code {
  width: 100%; font-family: var(--font-num); font-size: 13px; line-height: 1.5; padding: 10px 12px;
  border-radius: 6px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  resize: vertical; word-break: break-all;
}
.submit-ok { color: var(--good); font-weight: 700; }

/* Admin */
.admin-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.filters { display: grid; grid-template-columns: 160px 1fr; gap: 10px; }
@media (max-width: 480px) { .filters { grid-template-columns: 1fr; } }
.field select, .field input[type="search"] {
  font: inherit; min-height: 48px; padding: 10px 12px; border-radius: 6px; width: 100%; min-width: 0;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.admin-list { display: grid; gap: 14px; min-width: 0; }
.is-admin .wrap { max-width: 960px; }
.export-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#app > .panel + .panel { margin-top: 16px; }
.export-row .btn { min-height: 44px; }

/* 류·난이도 선택 */
.pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pick-lv { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 380px) { .pick-lv { grid-template-columns: repeat(2, 1fr); } }
.pick-btn {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 6px; padding: 8px 6px;
  display: grid; gap: 0; text-align: center; min-height: 56px; align-content: center; min-width: 0;
}
.pick-btn b { font-size: 16px; }
.pick-btn span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.pick-btn:hover { border-color: var(--ink); }
.pick-btn[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.pick-btn[aria-pressed="true"] span { color: var(--paper); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; }
.stats span { font-size: 13px; color: var(--muted); }
.stats b { font-family: var(--font-num); font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
table.subs { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
.subs th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 500; padding: 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
.subs td { padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.subs .num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.subs tr.open td { background: var(--paper); }
.mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.score-pill { display: inline-block; min-width: 40px; text-align: center; padding: 1px 8px; border-radius: 999px; font-weight: 500; }
.score-pill.pass { background: var(--good-bg); color: var(--good); }
.score-pill.fail { background: var(--bad-bg); color: var(--bad); }
.link-btn { background: none; border: none; padding: 4px 0; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
.detail { border: 2px solid var(--ink); border-radius: 6px; padding: 16px; display: grid; gap: 10px; }
.detail-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.detail .name { font-size: 18px; font-weight: 700; }
.score.small b { font-size: 40px; }
.ans-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.ans { border-left: 4px solid var(--good); padding: 4px 0 4px 12px; display: grid; gap: 4px; }
.ans.no { border-left-color: var(--bad); }
.ans-head { display: flex; gap: 8px; align-items: center; }
.ans-mark { font-size: 13px; font-weight: 700; }
.ans.ok .ans-mark { color: var(--good); }
.ans.no .ans-mark { color: var(--bad); }
.ans .q { font-weight: 700; }
.detail-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.detail-actions .btn { min-height: 44px; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: var(--card); }
.hint { font-size: 14px; color: var(--muted); }

/* Result breakdown */
.breakdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.breakdown div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 0; }
.breakdown span { font-size: 13px; color: var(--muted); }
.breakdown b { font-family: var(--font-num); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }

/* ---------- 꾸밈: 위험물 표지판 느낌 ---------- */
body {
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
  background-size: 18px 18px;
}
.plate {
  position: relative; overflow: hidden;
  grid-template-columns: 1fr auto; align-items: center; column-gap: 12px;
  padding: 20px 20px 30px; border-radius: 10px; box-shadow: var(--shadow);
  background-image: radial-gradient(120% 140% at 100% 0%, rgba(255, 255, 255, 0.16), transparent 55%);
}
.plate-text { display: grid; gap: 2px; min-width: 0; }
.plate h1 { font-size: 38px; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15); }
.emblem { width: 78px; height: 78px; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.25)); }
.em-plate { fill: var(--on-signal); }
.em-line { fill: none; stroke: var(--signal); stroke-width: 2.5; }
.em-flame { fill: var(--signal); }
.tape {
  position: absolute; left: 0; right: 0; bottom: 0; height: 12px;
  background: repeating-linear-gradient(135deg, var(--tape-a) 0 12px, var(--tape-b) 12px 24px);
}

.panel, .cert { border-radius: 12px; box-shadow: var(--shadow); }
.panel { border-color: transparent; }
.group-label { display: flex; align-items: center; gap: 8px; }
.group-label::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--signal); }

.btn { border-radius: 10px; transition: transform .12s ease, box-shadow .12s ease; }
.btn-primary { box-shadow: 0 6px 16px -8px var(--ink); }
.btn:active { transform: translateY(1px) scale(0.99); }
.mode { border-radius: 10px; transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease; position: relative; padding-right: 40px; }
.mode::after { content: "›"; position: absolute; right: 16px; top: 50%; transform: translateY(-52%); font-size: 26px; color: var(--muted); }
.mode:hover { transform: translateY(-1px); box-shadow: var(--shadow); }

/* 류 선택: 류마다 색 마름모 */
.pick-btn { position: relative; border-radius: 10px; padding-top: 12px; transition: border-color .15s ease, background-color .15s ease, transform .15s ease; }
.pick-btn:hover { border-color: var(--c, var(--ink)); }
.pick-cls .pick-btn { border-top: 4px solid var(--c); }
.pick-btn .dia {
  width: 22px; height: 22px; margin: 0 auto 4px; display: grid; place-items: center;
  background: var(--c); transform: rotate(45deg); border-radius: 3px; font-style: normal;
}
.pick-btn .dia em { transform: rotate(-45deg); font-style: normal; font-family: var(--font-num); font-size: 12px; color: var(--card); }
.pick-cls .pick-btn[aria-pressed="true"] {
  background: color-mix(in srgb, var(--c) 14%, var(--card)); color: var(--ink);
  border-color: var(--c); box-shadow: 0 0 0 2px var(--c) inset;
}
.pick-cls .pick-btn[aria-pressed="true"] span { color: var(--ink); }
.pick-lv .pick-btn[aria-pressed="true"] { box-shadow: 0 6px 16px -8px var(--ink); }

/* 문제 화면 */
.cls-chip { display: inline-flex; align-items: center; gap: 6px; }
.cls-chip i { width: 9px; height: 9px; background: var(--c); transform: rotate(45deg); border-radius: 1px; }
.bar { height: 8px; border-radius: 4px; }
.bar i {
  border-radius: 4px;
  background: repeating-linear-gradient(135deg, var(--signal) 0 10px, color-mix(in srgb, var(--signal) 78%, var(--card)) 10px 20px);
}
.question { font-size: 20px; }
.choice { border-radius: 10px; grid-template-columns: 32px 1fr auto; transition: border-color .15s ease, transform .15s ease, background-color .15s ease; }
.choice:hover:not(:disabled) { transform: translateX(2px); }
.choice.correct::after, .choice.wrong::after { font-weight: 700; font-size: 18px; }
.choice.correct::after { content: "✓"; color: var(--good); }
.choice.wrong::after { content: "✕"; color: var(--bad); }
.choice.wrong, .ox-btn.wrong, .sa input.wrong { animation: shake .35s ease; }
.ox-btn { border-radius: 14px; transition: transform .15s ease, border-color .15s ease; }
.ox-btn:hover:not(:disabled) { transform: translateY(-2px); }
.ox-btn[data-v="O"]:not(:disabled) { color: var(--c3); }
.ox-btn[data-v="X"]:not(:disabled) { color: var(--signal); }
.feedback { border-radius: 10px; border-left-width: 6px; animation: rise .25s ease both; }

/* 결과: 인증 카드 + 도장 */
.cert { position: relative; overflow: hidden; padding-top: 28px; }
.cert::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px;
  background: repeating-linear-gradient(135deg, var(--tape-a) 0 10px, var(--tape-b) 10px 20px);
}
.stamp {
  position: absolute; right: 18px; top: 58px; width: 96px; height: 96px; border-radius: 50%;
  border: 4px solid var(--signal); display: grid; place-items: center; transform: rotate(-14deg);
  box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--signal) inset; opacity: 0.9;
  animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both .15s;
}
.stamp span { font-family: var(--font-display); font-size: 26px; color: var(--signal); letter-spacing: 0.02em; }
.stamp.retry { border-color: var(--muted); box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--muted) inset; }
.stamp.retry span { color: var(--muted); font-size: 21px; }
.score b { font-size: 72px; }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }

  { tag: "유별", q: "제4류 위험물의 성질은?", c: ["산화성 고체", "가연성 고체", "인화성 액체", "자기반응성 물질"], a: 3,

  { tag: "유별", q: "제6류 위험물의 성질은?", c: ["산화성 액체", "인화성 액체", "산화성 고체", "가연성 고체"], a: 1,

  { tag: "유별", q: "제3류 위험물의 성질은?", c: ["자기반응성 물질", "자연발화성 및 금수성 물질", "산화성 액체", "인화성 액체"], a: 2,
    e: "제3류 위험물은 자연발화성 및 금수성 물질이다. 칼륨, 나트륨, 황린 등이 해당한다." },
  { tag: "유별", q: "제5류 위험물의 성질은?", c: ["산화성 고체", "자기반응성 물질", "인화성 액체", "산화성 액체"], a: 2,

  { tag: "제4류", q: "휘발유(제1석유류, 비수용성)의 지정수량은?", c: ["50L", "200L", "400L", "1,000L"], a: 2,

  { tag: "제4류", q: "경유는 제4류 위험물 중 어디에 속하는가?", c: ["제1석유류", "제2석유류", "제3석유류", "제4석유류"], a: 2,

  { tag: "제4류", q: "제4류 위험물 중 알코올류의 지정수량은?", c: ["200L", "400L", "1,000L", "2,000L"], a: 2,

  { tag: "제4류", q: "제1석유류는 1기압에서 인화점이 몇 ℃ 미만인 것인가?", c: ["0℃", "21℃", "70℃", "200℃"], a: 2,

  { tag: "제4류", q: "동식물유류의 지정수량은?", c: ["2,000L", "4,000L", "6,000L", "10,000L"], a: 4,

  { tag: "계산", q: "휘발유 400L와 경유 1,000L를 함께 저장할 때 지정수량 배수의 합은? (둘 다 비수용성)", c: ["1.5배", "2배", "3배", "4배"], a: 3,

  { tag: "저장", q: "칼륨과 나트륨을 저장할 때 사용하는 보호액은?", c: ["물", "석유(등유)", "알코올", "이산화탄소"], a: 2,
    e: "칼륨과 나트륨은 물과 반응해 수소를 발생하므로 석유(등유) 속에 저장해 공기와 수분을 차단한다." },
  { tag: "저장", q: "황린을 저장할 때 사용하는 보호액은?", c: ["물", "석유(등유)", "에탄올", "벤젠"], a: 1,

  { tag: "저장", q: "이황화탄소를 저장할 때 가연성 증기의 발생을 막기 위한 방법은?", c: ["석유 속에 저장", "물속에 저장", "알코올 속에 저장", "밀폐 없이 통풍 저장"], a: 2,
    e: "이황화탄소는 물보다 무겁고 물에 녹지 않으므로 물속에 저장해 가연성 증기 발생을 막는다." },
  { tag: "성질", q: "탄화칼슘이 물과 반응하여 생성되는 가연성 가스는?", c: ["메탄", "수소", "아세틸렌", "포스핀"], a: 3,

  { tag: "제6류", q: "과산화수소는 농도가 몇 중량퍼센트 이상인 것을 위험물로 보는가?", c: ["10", "25", "36", "49"], a: 3,

  { tag: "소화", q: "제4류 위험물 화재에 적응성이 가장 낮은 소화방법은?", c: ["포소화약제 방사", "이산화탄소 방사", "분말소화약제 방사", "봉상수(물줄기) 주수"], a: 4,
    e: "제4류 위험물은 대부분 물보다 가벼워 물줄기로 주수하면 기름이 물 위에 떠서 화재가 넓게 번질 수 있다. 질식소화(포, CO₂, 분말)가 적합하다." },
  { tag: "운반", q: "제4류 위험물 운반용기 외부에 표시해야 하는 주의사항은?", c: ["물기엄금", "화기엄금", "충격주의", "가연물접촉주의"], a: 2,

  { tag: "법령", q: "위험물안전관리자가 해임되거나 퇴직한 경우, 그날부터 며칠 이내에 다시 안전관리자를 선임해야 하는가?", c: ["14일", "30일", "60일", "90일"], a: 2,

  { cls: 1, lv: "B", tag: "소화", q: "제1류 위험물(알칼리금속의 과산화물 제외) 화재의 일반적인 소화방법은?", c: ["다량의 물로 냉각소화", "이산화탄소로 질식소화", "할론으로 억제소화", "포로 덮어 질식소화"], a: 1,

  { cls: 1, lv: "C", tag: "성질", q: "과산화나트륨이 물과 반응할 때 발생하는 가스는?", c: ["수소", "산소", "메탄", "아세틸렌"], a: 2,

  { cls: 1, lv: "C", tag: "소화", q: "알칼리금속의 과산화물 화재에 적합한 소화방법은?", c: ["다량의 물로 주수", "건조사로 덮어 소화", "포소화약제 방사", "강화액 방사"], a: 2,

  { cls: 2, lv: "A", tag: "유별", q: "다음 중 제2류 위험물이 아닌 것은?", c: ["황", "철분", "마그네슘", "황린"], a: 4,

  { cls: 2, lv: "B", tag: "지정수량", q: "제2류 위험물 중 지정수량이 500kg인 것은?", c: ["황화인", "적린", "마그네슘", "인화성 고체"], a: 3,

  { cls: 2, lv: "B", tag: "정의", q: "인화성 고체는 1기압에서 인화점이 몇 ℃ 미만인 고체인가?", c: ["21℃", "40℃", "70℃", "100℃"], a: 2,

  { cls: 2, lv: "C", tag: "운반", q: "철분·금속분·마그네슘의 운반용기 외부에 표시하는 주의사항은?", c: ["화기엄금", "화기주의 및 물기엄금", "가연물접촉주의", "화기엄금 및 충격주의"], a: 2,

/* 기존 문제의 류·난이도 (기존 기록과 맞도록 문제 번호는 그대로 둔다) */
const META = {
  mc0: [4, "A"], mc1: [6, "A"], mc2: [3, "A"], mc3: [5, "A"], mc4: [2, "A"], mc5: [4, "B"], mc6: [4, "B"], mc7: [4, "A"],
  mc8: [4, "B"], mc9: [4, "B"], mc10: [4, "B"], mc11: [4, "C"], mc12: [3, "A"], mc13: [3, "A"], mc14: [4, "B"], mc15: [3, "B"],
  mc16: [6, "B"], mc17: [4, "B"], mc18: [4, "C"], mc19: [0, "C"],
  ox0: [1, "A"], ox1: [3, "A"], ox2: [4, "B"], ox3: [4, "B"], ox4: [3, "A"], ox5: [6, "A"], ox6: [4, "A"], ox7: [5, "B"],
  ox8: [4, "B"], ox9: [4, "C"],
  sa0: [4, "A"], sa1: [4, "B"], sa2: [4, "B"], sa3: [4, "C"], sa4: [4, "C"], sa5: [3, "A"], sa6: [3, "B"], sa7: [3, "C"],
  sa8: [4, "C"], sa9: [4, "C"]
};
const CLS_NAME = { 1: "산화성 고체", 2: "가연성 고체", 3: "자연발화·금수", 4: "인화성 액체", 5: "자기반응성", 6: "산화성 액체" };
const LV_NAME = { A: "기초", B: "중급", C: "심화" };
const clsLabel = it => it.cls ? `제${it.cls}류` : "법령";

const withMeta = (x, id, type) => {
  const m = META[id] || [x.cls || 0, x.lv || "B"];
  return { ...x, id, type, cls: x.cls != null ? x.cls : m[0], lv: x.lv || m[1] };
};
const POOL = [
  ...QUESTIONS.map((x, i) => withMeta(x, "mc" + i, "mc")),
  ...OX.map((x, i) => withMeta(x, "ox" + i, "ox")),
  ...SA.map((x, i) => withMeta(x, "sa" + i, "sa"))
];
const BY_ID = Object.fromEntries(POOL.map(x => [x.id, x]));
const TYPE_NAME = { mc: "객관식", sa: "단답식", ox: "O/X" };
const UNIT_WORDS = {
  "L": ["l", "리터"], "℃": ["℃", "°c", "도"], "배": ["배"], "일": ["일"],
  "kg": ["kg", "킬로그램", "킬로"], "%": ["중량퍼센트", "퍼센트", "wt%", "%"]
};

/* 구글 시트 연동: GitHub Pages 배포본에만 Apps Script 웹앱 주소를 넣는다. claude.ai 링크에서는 비워 둔다. */
const REMOTE_URL = "";
const ADMIN_KEY_STORE = "hazmat-quiz-admin-key";
async function remoteCall(body) {
  const res = await withTimeout(fetch(REMOTE_URL, { method: "POST", body: JSON.stringify(body) }), 20000);
  const data = await res.json();
  if (!data || !data.ok) { const err = new Error((data && data.error) || "error"); err.code = data && data.error; throw err; }
  return data;
}
function getAdminKey() { try { return localStorage.getItem(ADMIN_KEY_STORE) || ""; } catch (e) { return ""; } }
function setAdminKey(k) { try { k ? localStorage.setItem(ADMIN_KEY_STORE, k) : localStorage.removeItem(ADMIN_KEY_STORE); } catch (e) {} }
const MODES = ["객관식", "단답식", "O/X", "종합", "오답 재도전", "제1류", "제2류", "제3류", "제4류", "제5류", "제6류"];
const modeMatch = (mode, m) => mode === m || String(mode).startsWith(m + " ");

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(data) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

let store = load();
let state = { v: 2, view: "start", order: [], idx: 0, picks: [], name: store.name || "", sid: store.sid || "", mode: "" };

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
const MARK = ["①", "②", "③", "④"];
const ids = type => POOL.filter(x => x.type === type).map(x => x.id);

function norm(s, unit) {
  let t = String(s).toLowerCase().replace(/[\s,.·()'"‘’“”]/g, "").replace(/₂/g, "2");
  if (unit) for (const w of UNIT_WORDS[unit] || []) if (t.endsWith(w)) { t = t.slice(0, -w.length); break; }
  return t;
}
function grade(item, value) {
  if (value == null) return false;
  if (item.type === "sa") return item.ans.some(a => norm(a, item.unit) === norm(value, item.unit));
  return value === item.a;
}
function shown(item, value) {
  if (item.type === "mc") return item.c[value - 1] ? `${MARK[value - 1]} ${item.c[value - 1]}` : String(value);
  return String(value);
}
function rightAnswer(item) {
  if (item.type === "mc") return `${MARK[item.a - 1]} ${item.c[item.a - 1]}`;
  if (item.type === "sa") return item.show;
  return item.a;
}
function scoreOf(rec) {
  const total = rec.order.length;
  const right = rec.order.filter((id, i) => BY_ID[id] && grade(BY_ID[id], rec.answers[i])).length;
  return { right, total, score: total ? Math.round((right / total) * 100) : 0 };
}
function fmtTime(t) {
  const d = new Date(t), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}

/* 제출 코드: 학번·이름·답안을 담은 문자열 (자동 제출이 안 될 때 사용) */
function encodeAttempt(r) {
  const json = JSON.stringify({ v: 1, s: r.sid, n: r.name, t: r.t, m: r.mode, o: r.order, a: r.answers });
  let bin = "";
  new TextEncoder().encode(json).forEach(b => { bin += String.fromCharCode(b); });
  return "WQ1-" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeAttempt(code) {
  try {
    const c = code.trim();
    if (!c.startsWith("WQ1-")) return null;
    let b = c.slice(4).replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    const bytes = Uint8Array.from(atob(b), ch => ch.charCodeAt(0));
    const o = JSON.parse(new TextDecoder().decode(bytes));
    if (!o || !Array.isArray(o.o) || !Array.isArray(o.a) || o.o.length !== o.a.length || !o.o.length) return null;
    if (!o.o.every(id => BY_ID[id])) return null;
    return { sid: String(o.s || ""), name: String(o.n || ""), t: Number(o.t) || 0, mode: String(o.m || ""), order: o.o.map(String), answers: o.a };
  } catch (e) { return null; }
}

  const total = state.order.length;
  const item = BY_ID[state.order[state.idx]];
  const pick = state.picks[state.idx];
  const answered = pick != null;
  const pct = ((state.idx + (answered ? 1 : 0)) / total) * 100;
  const isLast = state.idx === total - 1;

  const feedback = answered ? `
    <div class="feedback ${pick.correct ? "ok" : "no"}">
      <span class="verdict">${pick.correct ? "정답입니다" : `오답입니다 · 정답 ${esc(rightAnswer(item))}`}</span>
      <p>${esc(item.e)}</p>
    </div>
    <button class="btn btn-primary" id="next">${isLast ? "결과 보기" : "다음 문제"}</button>` : "";

  app.innerHTML = `
    <section class="panel">
      <div style="display:grid;gap:8px">
        <div class="progress-head"><span class="count">${state.idx + 1} / ${total}</span>
          <span class="chips"><span class="chip">${TYPE_NAME[item.type]}</span><span class="chip quiet cls-chip" style="--c:var(--c${item.cls || 4})"><i aria-hidden="true"></i>${clsLabel(item)} · 난이도 ${item.lv}</span></span></div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${state.idx + (answered ? 1 : 0)}"><i style="width:${pct}%"></i></div>
      </div>
      <p class="question">${esc(item.q)}</p>
      ${answerArea(item, pick)}
      ${feedback}
    </section>`;

  const commit = value => {
    state.picks[state.idx] = { value, correct: grade(item, value) };
    renderQuiz();
    document.getElementById("next")?.focus({ preventScroll: true });
  };
  app.querySelectorAll("[data-v]").forEach(btn => {
    btn.onclick = () => commit(item.type === "mc" ? Number(btn.dataset.v) : btn.dataset.v);
  });
  const form = document.getElementById("sa-form");
  if (form && !answered) {
    const input = document.getElementById("sa-input");
    input.focus({ preventScroll: true });
    form.addEventListener("submit", ev => {
      ev.preventDefault();
      const v = input.value.trim();
      if (!v) { input.placeholder = "답을 입력한 뒤 확인을 누르세요"; input.focus(); return; }
      commit(v);
    });
  }
  const next = document.getElementById("next");
  if (next) next.onclick = () => { if (isLast) finish(); else { state.idx++; render(); } };
}

function finish() {
  const rec = {
    sid: state.sid, name: state.name, t: Date.now(), mode: state.mode || "",
    order: state.order.slice(), answers: state.picks.map(p => (p ? p.value : null))
  };
  const result = scoreOf(rec);
  if (result.total >= 10) { store.best = Math.max(store.best || 0, result.score); save(store); }
  state.view = "result";
  state.result = result;
  state.rec = rec;
  state.submit = "pending";
  render();
  submitAttempt(rec);
}

async function submitAttempt(rec) {
  await withTimeout(capsReady, 12000).catch(() => {});
  if (cap.db && cap.uid) {
    try {
      const ref = cap.db.doc("submissions/" + cap.uid);
      const snap = await withTimeout(ref.get(), 8000);
      const body = snap.exists ? snap.data() : null;
      const prev = body && Array.isArray(body.attempts) ? body.attempts : [];
      if (!prev.some(a => a.t === rec.t)) {
        await withTimeout(ref.set({ updatedAt: Date.now(), attempts: [...prev, rec].slice(-60) }), 8000);
      }
      if (state.rec === rec) { state.submit = "done"; paintSubmit(); }
      return;
    } catch (e) {}
  }
  if (REMOTE_URL) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        await remoteCall({ action: "submit", record: { ...rec, ...scoreOf(rec) } });
        if (state.rec === rec) { state.submit = "done"; paintSubmit(); }
        return;
      } catch (e) { await new Promise(r => setTimeout(r, 1500)); }
    }
  }
  if (state.rec === rec) { state.submit = "code"; paintSubmit(); }
}

function paintSubmit() {
  const box = document.getElementById("submit-box");
  if (!box) return;
  if (!state.rec) { box.hidden = true; return; }
  if (state.submit === "pending") {
    box.innerHTML = `<h2>결과 제출</h2><p class="muted">교수님께 제출하는 중이에요…</p>`;
    return;
  }
  if (state.submit === "done") {
    box.innerHTML = `<h2>결과 제출</h2><p class="submit-ok">교수님께 제출했어요.</p>
      <p class="muted">${esc(state.sid)} ${esc(state.name)} · ${state.result.score}점 · 답안 ${state.result.total}개</p>`;
    return;
  }
  const code = encodeAttempt(state.rec);
  box.innerHTML = `<h2>제출 코드</h2>
    <p>이 화면에서는 자동 제출이 되지 않아요. 아래 코드를 복사해서 교수님께 보내주세요. 학번, 이름, 답안이 모두 들어 있어요.</p>
    <textarea id="code" class="code" readonly rows="4" aria-label="제출 코드">${esc(code)}</textarea>
    <button class="btn btn-primary" id="copy">코드 복사</button>
    <p class="muted" id="copy-msg" aria-live="polite"></p>`;
  const ta = document.getElementById("code"), msg = document.getElementById("copy-msg");
  document.getElementById("copy").onclick = () => {
    const fallback = () => { ta.focus(); ta.select(); msg.textContent = "코드를 선택했어요. 길게 눌러 복사하세요."; };
    try {
      navigator.clipboard.writeText(code).then(() => { msg.textContent = "복사했어요. 단톡방이나 메시지로 교수님께 보내주세요."; }, fallback);
    } catch (e) { fallback(); }
  };
}

function renderResult() {
  const { right, total, score } = state.result;
  const pass = score >= PASS;
  const d = new Date();
  const date = `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
  const items = state.order.map((id, i) => ({ item: BY_ID[id], pick: state.picks[i] }));
  const wrong = items.filter(o => !o.pick.correct);

  const types = ["mc", "sa", "ox"].filter(t => items.some(o => o.item.type === t));
  const breakdown = types.length > 1 ? `<div class="breakdown">${types.map(t => {
    const all = items.filter(o => o.item.type === t);
    return `<div><span>${TYPE_NAME[t]}</span><b>${all.filter(o => o.pick.correct).length} / ${all.length}</b></div>`;
  }).join("")}</div>` : "";

  const review = wrong.length ? wrong.map(({ item, pick }) => `
    <div class="review-item">
      <span class="chips"><span class="chip">${TYPE_NAME[item.type]}</span></span>
      <p class="q">${esc(item.q)}</p>
      <p class="a">정답 ${esc(rightAnswer(item))}</p>
      <p class="mine">내 답 ${esc(shown(item, pick.value))}</p>
      <p class="muted">${esc(item.e)}</p>
    </div>`).join("") : `<p class="muted">틀린 문제가 없어요. 모두 맞혔습니다.</p>`;

  app.innerHTML = `
    <section class="cert" aria-label="결과">
      <div class="stamp ${pass ? "" : "retry"}" aria-hidden="true"><span>${pass ? "합격" : "재도전"}</span></div>
      <div class="cert-top"><span>위험물 Quiz 결과</span><span>${date}</span></div>
      ${state.sid || state.name ? `<p class="name"><span class="sid">${esc(state.sid || "")}</span>${esc(state.name || "")}</p>` : ""}
      <div class="score"><b>${score}</b><span>점</span></div>
      <p class="muted">${total}문제 중 ${right}문제 정답</p>
      ${breakdown}
      <span class="verdict-pill ${pass ? "pass" : "fail"}">${pass ? `합격선 ${PASS}점 통과` : `합격선 ${PASS}점까지 ${PASS - score}점`}</span>
    </section>
    <div style="height:16px"></div>
    <section class="panel" id="submit-box" aria-live="polite"></section>
    <div style="height:16px"></div>
    <section class="panel">
      <h2>틀린 문제 ${wrong.length}개</h2>
      <div class="review">${review}</div>
      <div class="btn-row">
        ${wrong.length ? `<button class="btn btn-primary" id="retry-wrong">틀린 문제 다시 풀기</button>` : ""}
        <button class="btn" id="home" ${wrong.length ? "" : 'style="grid-column:1/-1"'}>처음으로</button>
      </div>
    </section>`;

  paintSubmit();
  const rw = document.getElementById("retry-wrong");
  if (rw) rw.onclick = () => startQuiz(shuffle(wrong.map(o => o.item.id)), "오답 재도전");
  document.getElementById("home").onclick = () => { state.view = "start"; render(); };
}

/* ---------- 관리자 모드 (퀴즈 주인 계정에서만) ---------- */
const admin = { subs: [], auto: [], imp: [], loaded: false, slow: false, error: "", mode: "all", q: "", open: null, del: null, timer: null, remote: false, started: false };

function stopAdmin() {
  admin.subs.forEach(u => { try { u(); } catch (e) {} });
  admin.subs = [];
  admin.started = false;
  clearTimeout(admin.timer);
}

/* 구글 시트에서 제출 기록 불러오기 */
async function loadRemote() {
  admin.started = true; admin.loaded = false; admin.slow = false; admin.error = "";
  paintAdmin();
  try {
    const data = await remoteCall({ action: "list", key: getAdminKey() });
    admin.auto = (data.rows || []).map(r => ({ ...r, src: r.src === "code" ? "code" : "auto", doc: "sheet" }));
    admin.imp = [];
    admin.loaded = true;
  } catch (e) {
    if (e.code === "key") { setAdminKey(""); renderAdminLogin("관리자 키가 바뀌었어요. 다시 입력해 주세요."); return; }
    admin.loaded = true;
    admin.error = "구글 시트에서 기록을 불러오지 못했어요. '새로고침'을 눌러 다시 시도해 주세요.";
  }
  paintAdmin();
}

function startAdmin() {
  if (admin.remote) { loadRemote(); return; }
  admin.loaded = false; admin.slow = false; admin.error = "";
  if (!cap.db) { admin.loaded = true; admin.error = "제출 기록 저장소에 연결할 수 없어요. 잠시 뒤 다시 열어주세요."; return; }
  admin.timer = setTimeout(() => { if (!admin.loaded) { admin.slow = true; paintAdmin(); } }, 10000);
  admin.subs.push(cap.db.collection("submissions").onSnapshot(snap => {
    const rows = [];
    snap.docs.forEach(d => {
      const body = d.data() || {};
      (Array.isArray(body.attempts) ? body.attempts : []).forEach(a => rows.push({ ...a, src: "auto", doc: d.id }));
    });
    admin.auto = rows;
    if (!snap.metadata.fromCache) { admin.loaded = true; admin.slow = false; clearTimeout(admin.timer); }
    paintAdmin();
  }, () => {
    admin.loaded = true; admin.error = "제출 기록을 불러오지 못했어요. 페이지를 다시 열어주세요.";
    clearTimeout(admin.timer); paintAdmin();
  }));
  admin.subs.push(cap.db.collection("imports").onSnapshot(snap => {
    admin.imp = snap.docs.map(d => ({ ...d.data(), src: "code", doc: d.id }));
    paintAdmin();
  }, () => {}));
}

function allRows() {
  const seen = new Set(), out = [];
  for (const r of [...admin.auto, ...admin.imp]) {
    if (!r || !Array.isArray(r.order) || !Array.isArray(r.answers)) continue;
    const k = r.sid + "|" + r.t;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push({ ...r, key: r.src + ":" + r.doc + ":" + r.t, ...scoreOf(r) });
  }
  return out.sort((a, b) => b.t - a.t);
}

function filterRows(rows) {
  const q = admin.q.trim();
  return rows.filter(r => (admin.mode === "all" || modeMatch(r.mode, admin.mode)) &&
    (!q || String(r.sid).includes(q) || String(r.name).includes(q)));
}

async function exportExcel() {
  const msg = document.getElementById("export-msg");
  const list = filterRows(allRows());
  if (!list.length) { msg.textContent = "내려받을 제출 기록이 없어요."; return; }
  if (!window.XLSX) { msg.textContent = "엑셀 변환 도구를 불러오지 못했어요. 페이지를 새로고침한 뒤 다시 눌러주세요."; return; }
  if (!cap.downloads && !admin.remote) { msg.textContent = "이 화면에서는 파일 저장을 쓸 수 없어요. claude.ai에서 퀴즈를 열어 다시 눌러주세요."; return; }

  const answerText = r => r.order.map((id, i) => {
    const it = BY_ID[id];
    if (!it) return "";
    const v = r.answers[i];
    return `${i + 1}번 ${v == null ? "(무응답)" : shown(it, v)} ${grade(it, v) ? "○" : "✕"}`;
  }).filter(Boolean).join(" / ");
  const summary = [["학번", "이름", "점수", "정답 수", "문제 수", "합격선(60점)", "유형", "제출 시각", "제출 방식", "작성한 답 (○ 정답, ✕ 오답)"],
    ...list.map(r => [String(r.sid), String(r.name), r.score, r.right, r.total, r.score >= PASS ? "통과" : "미달",
      r.mode, fmtTime(r.t), r.src === "auto" ? "자동 제출" : "제출 코드", answerText(r)])];

  const answers = [["제출 시각", "학번", "이름", "유형", "번호", "문제 유형", "류", "난이도", "문제", "학생 답", "정답", "정오"]];
  const stat = {}, tstat = {}, cstat = {}, lstat = {};
  list.forEach(r => r.order.forEach((id, i) => {
    const it = BY_ID[id];
    if (!it) return;
    const v = r.answers[i], ok = grade(it, v);
    answers.push([fmtTime(r.t), String(r.sid), String(r.name), r.mode, i + 1, TYPE_NAME[it.type], clsLabel(it), it.lv, it.q,
      v == null ? "(무응답)" : shown(it, v), String(rightAnswer(it)), ok ? "O" : "X"]);
    const s = stat[id] || (stat[id] = { n: 0, ok: 0 });
    s.n++; if (ok) s.ok++;
    const ts = tstat[it.type] || (tstat[it.type] = { n: 0, ok: 0 });
    ts.n++; if (ok) ts.ok++;
    const cs = cstat[it.cls] || (cstat[it.cls] = { n: 0, ok: 0 });
    cs.n++; if (ok) cs.ok++;
    const ls = lstat[it.lv] || (lstat[it.lv] = { n: 0, ok: 0 });
    ls.n++; if (ok) ls.ok++;
  }));

  const items = [["문제 유형", "류", "난이도", "문제", "정답", "응답 수", "정답 수", "정답률(%)"],
    ...POOL.filter(it => stat[it.id]).map(it => {
      const s = stat[it.id];
      return [TYPE_NAME[it.type], clsLabel(it), it.lv, it.q, String(rightAnswer(it)), s.n, s.ok, Math.round((s.ok / s.n) * 100)];
    }).sort((a, b) => a[7] - b[7])];

  const scores = list.map(r => r.score);
  const avgOf = a => a.length ? Math.round((a.reduce((s, x) => s + x, 0) / a.length) * 10) / 10 : 0;
  const median = a => {
    const s = [...a].sort((x, y) => x - y), m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  const pct = (n, d) => d ? Math.round((n / d) * 100) : 0;
  const passN = scores.filter(s => s >= PASS).length;
  const q = admin.q.trim();
  const scope = (admin.mode === "all" ? "전체 유형" : admin.mode) + (q ? ` · 검색어 "${q}"` : "");

  const stats = [
    ["위험물 Quiz 제출 통계"],
    ["내려받은 시각", fmtTime(Date.now())],
    ["범위", scope],
    [],
    ["전체 통계"],
    ["제출 건수", list.length],
    ["응시 학생 수", new Set(list.map(r => r.sid)).size],
    ["평균 점수", avgOf(scores)],
    ["중앙값", median(scores)],
    ["최고 점수", Math.max(...scores)],
    ["최저 점수", Math.min(...scores)],
    ["합격선(60점) 통과", passN],
    ["통과율(%)", pct(passN, list.length)],
    [],
    ["퀴즈 유형별 통계"],
    ["유형", "제출 건수", "평균 점수", "최고 점수", "최저 점수", "통과 건수", "통과율(%)"],
    ...[...new Set(list.map(r => r.mode))].sort((a, b) => a.localeCompare(b)).map(m => {
      const s = list.filter(r => r.mode === m).map(r => r.score), p = s.filter(x => x >= PASS).length;
      return [m, s.length, avgOf(s), Math.max(...s), Math.min(...s), p, pct(p, s.length)];
    }),
    [],
    ["문제 유형별 정답률"],
    ["문제 유형", "응답 수", "정답 수", "정답률(%)"],
    ...["mc", "sa", "ox"].filter(t => tstat[t]).map(t => [TYPE_NAME[t], tstat[t].n, tstat[t].ok, pct(tstat[t].ok, tstat[t].n)]),
    [],
    ["류별 정답률"],
    ["류", "응답 수", "정답 수", "정답률(%)"],
    ...[1, 2, 3, 4, 5, 6, 0].filter(c => cstat[c]).map(c => [c ? `제${c}류 ${CLS_NAME[c]}` : "법령", cstat[c].n, cstat[c].ok, pct(cstat[c].ok, cstat[c].n)]),
    [],
    ["난이도별 정답률"],
    ["난이도", "응답 수", "정답 수", "정답률(%)"],
    ...["A", "B", "C"].filter(l => lstat[l]).map(l => [`${l} ${LV_NAME[l]}`, lstat[l].n, lstat[l].ok, pct(lstat[l].ok, lstat[l].n)]),
    [],
    ["점수 분포"],
    ["점수 구간", "제출 건수", "비율(%)"],
    ...[[80, 100], [60, 79], [40, 59], [0, 39]].map(([lo, hi]) => {
      const n = scores.filter(s => s >= lo && s <= hi).length;
      return [`${lo}~${hi}점`, n, pct(n, list.length)];
    })
  ];

  const bySid = new Map();
  [...list].sort((a, b) => a.t - b.t).forEach(r => {
    const k = String(r.sid);
    const g = bySid.get(k) || { name: "", scores: [], last: null };
    g.name = String(r.name); g.scores.push(r.score); g.last = r;
    bySid.set(k, g);
  });
  const students = [["학번", "이름", "응시 횟수", "평균 점수", "최고 점수", "최저 점수", "최근 점수", "최근 제출 시각", "최근 유형"],
    ...[...bySid.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([sid, g]) => [
      sid, g.name, g.scores.length, avgOf(g.scores), Math.max(...g.scores), Math.min(...g.scores),
      g.last.score, fmtTime(g.last.t), g.last.mode])];

  const wb = XLSX.utils.book_new();
  const add = (rows, name, widths) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = widths.map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  add(stats, "요약 통계", [20, 16, 12, 12, 12, 12, 12]);
  add(summary, "제출 기록", [12, 10, 6, 8, 8, 12, 11, 17, 10, 90]);
  add(students, "학생별 요약", [12, 10, 9, 10, 10, 10, 10, 17, 11]);
  add(answers, "답안", [17, 12, 10, 11, 6, 9, 7, 7, 60, 26, 26, 6]);
  add(items, "문항별 정답률", [9, 7, 7, 60, 26, 8, 8, 10]);
  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });

  const d = new Date(), p = n => String(n).padStart(2, "0");
  const filename = `위험물Quiz_제출기록_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.xlsx`;
  if (admin.remote) {
    const url = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 5000);
    msg.textContent = `제출 기록 ${list.length}건을 엑셀 파일로 내려받았어요.`;
    return;
  }
  msg.textContent = "저장 확인 창에서 저장을 눌러주세요.";
  try {
    await cap.downloads.save({ filename, data: buf });
    msg.textContent = `제출 기록 ${list.length}건을 엑셀 파일로 저장했어요.`;
  } catch (e) {
    const c = e && e.code;
    msg.textContent = c === "declined" ? "저장을 취소했어요."
      : c === "rate_limited" ? "저장 확인 창이 이미 열려 있어요. 잠시 뒤 다시 눌러주세요."
      : "파일을 저장하지 못했어요. 잠시 뒤 다시 눌러주세요.";
  }
}

function renderAdmin() {
  window.scrollTo({ top: 0 });
  app.innerHTML = `
    <section class="panel">
      <div class="admin-head"><h2>관리자 모드</h2><a class="admin-link" href="#">퀴즈로 돌아가기</a></div>
      ${admin.remote
        ? `<p class="muted">학생이 제출한 결과는 교수님의 구글 스프레드시트에 저장되고, 이 화면에서 모아 봅니다. 붙여넣은 제출 코드도 같은 시트에 들어갑니다.</p>
           <div class="detail-actions"><button class="btn" id="refresh-btn">새로고침</button><button class="btn" id="logout-btn">관리자 키 지우기</button></div>`
        : `<p class="muted">이 화면은 퀴즈를 만든 교수님 계정에서만 열립니다. 학생이 자동 제출한 결과와, 붙여넣은 제출 코드가 한 목록에 모입니다.</p>`}
    </section>
    <section class="panel">
      <h2>제출 코드 추가</h2>
      <p class="muted">학생이 보낸 제출 코드(WQ1-로 시작)를 붙여넣으세요. 여러 개를 줄바꿈으로 한 번에 넣어도 됩니다.</p>
      <textarea id="import-codes" class="code" rows="4" placeholder="WQ1-..."></textarea>
      <button class="btn btn-primary" id="import-btn">코드 추가</button>
      <p class="muted" id="import-msg" aria-live="polite"></p>
    </section>
    <section class="panel">
      <h2>제출 기록</h2>
      <div class="filters">
        <div class="field">
          <label for="f-mode">유형</label>
          <select id="f-mode">
            <option value="all">전체</option>
            ${MODES.map(m => `<option value="${esc(m)}" ${admin.mode === m ? "selected" : ""}>${esc(m)}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label for="f-q">학번·이름 검색</label>
          <input id="f-q" type="search" placeholder="예: 2026 또는 홍길동" value="${esc(admin.q)}">
        </div>
      </div>
      <div class="export-row">
        <button class="btn" id="export-btn">엑셀로 내려받기</button>
        <span class="muted" id="export-msg" aria-live="polite">지금 목록에 보이는 기록(유형·검색 조건 적용)을 내려받습니다.</span>
      </div>
      <div id="admin-list" class="admin-list"></div>
    </section>`;

  document.getElementById("import-btn").onclick = importCodes;
  document.getElementById("export-btn").onclick = exportExcel;
  document.getElementById("f-mode").onchange = e => { admin.mode = e.target.value; admin.open = null; paintAdmin(); };
  document.getElementById("f-q").oninput = e => { admin.q = e.target.value; paintAdmin(); };
  document.getElementById("admin-list").onclick = onAdminClick;
  if (admin.remote) {
    document.getElementById("refresh-btn").onclick = loadRemote;
    document.getElementById("logout-btn").onclick = () => { setAdminKey(""); stopAdmin(); renderAdminLogin(); };
  }
  if (admin.remote ? !admin.started : !admin.subs.length) startAdmin();
  paintAdmin();
}

function paintAdmin() {
  const box = document.getElementById("admin-list");
  if (!box) return;
  const rows = allRows();
  const list = filterRows(rows);
  const students = new Set(list.map(r => r.sid)).size;
  const avg = list.length ? Math.round(list.reduce((s, r) => s + r.score, 0) / list.length) : 0;

  let status = "";
  if (admin.error) status = `<p class="form-error">${esc(admin.error)}</p>`;
  else if (!admin.loaded) status = `<p class="muted">${admin.slow ? "제출 기록에 아직 연결하지 못했어요. 인터넷 연결을 확인해 주세요." : "제출 기록을 불러오는 중이에요…"}</p>`;

  const open = list.find(r => r.key === admin.open);
  const table = list.length ? `
    <div class="table-wrap">
      <table class="subs">
        <thead><tr><th>제출 시각</th><th>학번</th><th>이름</th><th>유형</th><th class="num">점수</th><th class="num">정답</th><th>답안</th></tr></thead>
        <tbody>${list.map(r => `
          <tr class="${r.key === admin.open ? "open" : ""}">
            <td class="mono">${fmtTime(r.t)}</td>
            <td class="mono">${esc(r.sid)}</td>
            <td>${esc(r.name)}</td>
            <td>${esc(r.mode)}</td>
            <td class="num"><span class="score-pill ${r.score >= PASS ? "pass" : "fail"}">${r.score}</span></td>
            <td class="num">${r.right}/${r.total}</td>
            <td><button class="link-btn" data-open="${esc(r.key)}">${r.key === admin.open ? "닫기" : "답안 보기"}</button></td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>` : (admin.loaded && !admin.error ? `<p class="muted">${rows.length ? "조건에 맞는 제출 기록이 없어요." : "아직 제출된 결과가 없어요. 학생이 퀴즈를 마치면 여기에 모입니다. 자동 제출이 안 되는 학생이 보낸 제출 코드는 위에 붙여넣으세요."}</p>` : "");

  box.innerHTML = `
    ${status}
    <div class="stats">
      <div><span>제출</span><b>${list.length}건</b></div>
      <div><span>학생</span><b>${students}명</b></div>
      <div><span>평균 점수</span><b>${list.length ? avg + "점" : "-"}</b></div>
    </div>
    ${open ? detailHtml(open) : ""}
    ${table}`;
}

function detailHtml(r) {
  const items = r.order.map((id, i) => {
    const it = BY_ID[id];
    if (!it) return "";
    const v = r.answers[i];
    const ok = grade(it, v);
    return `<li class="ans ${ok ? "ok" : "no"}">
      <div class="ans-head"><span class="mono">${i + 1}.</span><span class="chip">${TYPE_NAME[it.type]}</span><span class="ans-mark">${ok ? "정답" : "오답"}</span></div>
      <p class="q">${esc(it.q)}</p>
      <p>학생 답: <b>${esc(v == null ? "(무응답)" : shown(it, v))}</b></p>
      ${ok ? "" : `<p class="muted">정답: ${esc(rightAnswer(it))}</p>`}
    </li>`;
  }).join("");
  const del = admin.del === r.key
    ? `<span class="muted">이 제출 기록을 삭제할까요? 되돌릴 수 없어요.</span>
       <button class="btn btn-danger" data-del-yes="${esc(r.key)}">삭제</button>
       <button class="btn" data-del-no="1">취소</button>`
    : `<button class="btn" data-del="${esc(r.key)}">기록 삭제</button>`;
  return `<div class="detail" id="detail">
    <div class="detail-head">
      <div>
        <p class="name"><span class="sid">${esc(r.sid)}</span>${esc(r.name)}</p>
        <p class="muted">${esc(r.mode)} · ${fmtTime(r.t)} · ${r.src === "auto" ? "자동 제출" : "제출 코드"}</p>
      </div>
      <div class="score small"><b>${r.score}</b><span>점</span></div>
    </div>
    <p class="muted">${r.total}문제 중 ${r.right}문제 정답</p>
    <ol class="ans-list">${items}</ol>
    <div class="detail-actions">${del}<button class="btn" data-close="1">닫기</button></div>
  </div>`;
}

function onAdminClick(e) {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.open) {
    admin.open = admin.open === b.dataset.open ? null : b.dataset.open;
    admin.del = null; paintAdmin();
    if (admin.open) document.getElementById("detail")?.scrollIntoView({ block: "start" });
  } else if (b.dataset.close) { admin.open = null; admin.del = null; paintAdmin(); }
  else if (b.dataset.del) { admin.del = b.dataset.del; paintAdmin(); }
  else if (b.dataset.delNo) { admin.del = null; paintAdmin(); }
  else if (b.dataset.delYes) deleteRow(b.dataset.delYes);
}

async function deleteRow(key) {
  const r = allRows().find(x => x.key === key);
  if (!r) return;
  if (admin.remote) {
    try {
      await remoteCall({ action: "delete", key: getAdminKey(), sid: r.sid, t: r.t });
      admin.open = null; admin.del = null;
      await loadRemote();
    } catch (e) { admin.error = "삭제하지 못했어요. 잠시 뒤 다시 시도해 주세요."; paintAdmin(); }
    return;
  }
  if (!cap.db) return;
  try {
    if (r.src === "code") {
      await cap.db.doc("imports/" + r.doc).delete();
    } else {
      const ref = cap.db.doc("submissions/" + r.doc);
      const snap = await ref.get();
      const body = snap.exists ? snap.data() : {};
      const list = Array.isArray(body.attempts) ? body.attempts : [];
      await ref.set({ ...body, attempts: list.filter(a => a.t !== r.t) });
    }
    admin.open = null; admin.del = null; admin.error = "";
    paintAdmin();
  } catch (e) {
    admin.error = "삭제하지 못했어요. 잠시 뒤 다시 시도해 주세요."; paintAdmin();
  }
}

async function importCodes() {
  const ta = document.getElementById("import-codes"), msg = document.getElementById("import-msg");
  const parts = ta.value.split(/\s+/).filter(Boolean);
  if (!parts.length) { msg.textContent = "붙여넣은 코드가 없어요."; return; }
  if (admin.remote) {
    const recs = [];
    let bad = 0;
    for (const p of parts) { const rec = decodeAttempt(p); rec ? recs.push(rec) : bad++; }
    let added = 0, dup = 0;
    if (recs.length) {
      msg.textContent = "구글 시트에 추가하는 중이에요…";
      try {
        const res = await remoteCall({ action: "import", key: getAdminKey(), records: recs.map(r => ({ ...r, ...scoreOf(r) })) });
        added = res.added || 0; dup = res.dup || 0; bad += res.bad || 0;
      } catch (e) { msg.textContent = "구글 시트에 추가하지 못했어요. 잠시 뒤 다시 시도해 주세요."; return; }
    }
    msg.textContent = `${added}건 추가했어요.` +
      (dup ? ` 이미 있는 기록 ${dup}건은 건너뛰었어요.` : "") +
      (bad ? ` 읽을 수 없는 코드 ${bad}건이 있어요. 코드가 잘리지 않았는지 확인해 주세요.` : "");
    if (added && !bad) ta.value = "";
    if (added) loadRemote();
    return;
  }
  if (!cap.db) { msg.textContent = "저장소에 연결할 수 없어 추가하지 못했어요. 잠시 뒤 다시 시도해 주세요."; return; }
  const existing = new Set(allRows().map(r => r.sid + "|" + r.t));
  let added = 0, dup = 0, bad = 0;
  for (const p of parts) {
    const rec = decodeAttempt(p);
    if (!rec) { bad++; continue; }
    const k = rec.sid + "|" + rec.t;
    if (existing.has(k)) { dup++; continue; }
    existing.add(k);
    const id = (rec.t + "-" + rec.sid).replace(/[^A-Za-z0-9_\-~:@+]/g, "_").slice(0, 150);
    try { await cap.db.doc("imports/" + id).set(rec); added++; } catch (e) { bad++; }
  }
  msg.textContent = `${added}건 추가했어요.` +
    (dup ? ` 이미 있는 기록 ${dup}건은 건너뛰었어요.` : "") +
    (bad ? ` 읽을 수 없는 코드 ${bad}건이 있어요. 코드가 잘리지 않았는지 확인해 주세요.` : "");
  if (added && !bad) ta.value = "";
}

function boot(saved) {
  if (saved && saved.v === 2 && saved.view) state = saved;
  state.sid = state.sid || store.sid || "";
  state.name = state.name || store.name || "";
  route();
}
window.addEventListener("hashchange", route);
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data);
</script>
